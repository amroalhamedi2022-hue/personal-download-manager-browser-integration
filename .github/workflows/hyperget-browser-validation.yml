name: HyperGet browser transport validation
on:
  workflow_dispatch:
  push:
    branches: [fix/hyperget-native-transport-reliability-20261127]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/hyperget-browser-validation.yml"
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Exercise real TypeScript transport with mocked browser runtime
        run: node --test tests/native-transport.test.cjs
      - name: Build Chrome and Firefox extension packages
        run: npm run build
      - name: Verify manifests and stable extension identity
        run: |
          node -e 'const a=require("./dist/chrome/manifest.json"), b=require("./dist/firefox/manifest.json"); if(a.manifest_version!==3 || !a.key || b.manifest_version!==2 || b.browser_specific_settings?.gecko?.id!=="browser-integration@personaldownloadmanager.local") throw Error("Unexpected extension identity");'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hyperget-browser-builds
          path: |
            dist/chrome/**
            dist/firefox/**
          if-no-files-found: error
          retention-days: 7
